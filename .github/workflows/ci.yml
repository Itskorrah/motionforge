name: MotionForge CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax validation
        run: |
          for f in *.mjs studio/*.mjs test/*.mjs web/*.js; do node --check "$f"; done
      - name: Unit tests
        run: npm test
      - name: Validate example project
        run: node studio.mjs plan projects/demo/project.json
      # Optional full video smoke test is in workflow_dispatch render.yml to avoid
      # consuming minutes on every commit. GitHub-hosted minutes may be exhausted.
